# Run the unit test suite.
# Fails if compiler, publish-script, or documentation-guard tests fail.
name: tests

on:
  pull_request:
    paths:
      - "tests/**"
      - "scripts/**"
      - "pytest.ini"
      - "skills.sh.json"
      - "compiled-skills/**"
      - "*.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/tests.yml"
  push:
    branches: [init, main, master]
    paths:
      - "tests/**"
      - "scripts/**"
      - "pytest.ini"
      - "skills.sh.json"
      - "compiled-skills/**"
      - "*.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-compile.txt -r scripts/requirements-test.txt
      - name: Run unit tests
        run: python3 -m pytest tests/unit -v
