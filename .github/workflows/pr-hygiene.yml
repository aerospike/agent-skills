# Validate the PR title as a conventional commit.
# JIRA is never required here: outside contributors cannot see or open Aerospike tickets.
name: pr-hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  hygiene:
    uses: aerospike/shared-workflows/.github/workflows/reusable_pr-hygiene.yml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      pr_title: ${{ github.event.pull_request.title }}
      types-requiring-jira: ""
