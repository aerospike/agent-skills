# Compile skills/ into compiled-skills/.
# Fails if compiled-skills/ is stale — on pull requests and on push to init/main.
# Maintainers: run `python3 scripts/compile-agents.py --write` locally when skills change.
name: compile-agents

on:
  pull_request:
    paths:
      - "skills/**"
      - "compiled-skills/**"
      - "scripts/compile-agents.py"
      - "scripts/skills_compile/**"
      - ".github/workflows/compile-agents.yml"
  push:
    branches: [init, main, master]
    paths:
      - "skills/**"
      - "compiled-skills/**"
      - "scripts/compile-agents.py"
      - "scripts/skills_compile/**"
      - ".github/workflows/compile-agents.yml"

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-compile.txt
      - name: Check compiled-skills/ is up to date
        run: python3 scripts/compile-agents.py --shape stripped --check
