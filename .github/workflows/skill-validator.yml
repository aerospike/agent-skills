# Validates all packages under skills/ with agent-ecosystem/skill-validator.
# Keep SKILL_VALIDATOR_VERSION in sync with scripts/validate-skill.sh message and CONTRIBUTING.md.
name: skill-validator

on:
  pull_request:
    paths:
      - "skills/**"
      - "compiled-skills/**"
      - ".github/workflows/skill-validator.yml"
      - "scripts/validate-skill.sh"
  push:
    branches:
      - main
      - master
      - init
    paths:
      - "skills/**"
      - "compiled-skills/**"
      - ".github/workflows/skill-validator.yml"
      - "scripts/validate-skill.sh"
  # Called by publish-registries.yml so a release cannot publish a tree with
  # broken links or oversized references.
  workflow_call:

env:
  SKILL_VALIDATOR_VERSION: v1.5.5

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          # No go.mod in this repo; default module cache would warn/fail restore.
          cache: false

      - name: Install skill-validator
        run: |
          go install "github.com/agent-ecosystem/skill-validator/cmd/skill-validator@${SKILL_VALIDATOR_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate skills (annotations, non-strict)
        run: |
          set +e
          ./scripts/validate-skill.sh --ci
          code=$?
          set -e
          # Without --strict, skill-validator uses exit 2 for warnings-only; pass that in CI.
          if [[ "$code" -eq 2 ]]; then exit 0; fi
          exit "$code"

      - name: Append markdown report to job summary
        if: success()
        run: |
          {
            echo "## skill-validator"
            set +e
            skill-validator check \
              --allow-flat-layouts \
              -o markdown skills/ compiled-skills/
            sum=$?
            set -e
            [[ "$sum" -eq 0 || "$sum" -eq 2 ]] || exit "$sum"
          } >> "$GITHUB_STEP_SUMMARY"
